<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotton Bath Towel – Towel Town</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="layout-boxed" data-page="index">
<header class="site-header">
  <a class="brand" href="index.html">Towel Town</a>
  <nav><a href="cart.html">Your haul</a></nav>
</header>
<main class="shell">
<section class="product">
  <div class="product-image">Cotton Bath Towel</div>
  <div class="product-info">
  <h1>Cotton Bath Towel</h1>
  <p class="blurb">600 GSM combed cotton bath towel, 70 x 140 cm, sand colour.</p>
  <p class="price">Price ₹599 each</p>
  
  <div class="price-lines">
    <div class="line"><span>Price (each)</span><span>₹599</span></div>
    <div class="line"><span>Delivery</span><span>₹40</span></div>
    <div class="line total"><span>Total (one unit)</span><span>₹639</span></div>
  </div>
  <p><label>Quantity <select id="quantity-select"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label> <span class="hint">Most people buy 2</span></p>
  <p id="notice" class="notice"></p>
  <button id="add-button" type="button">Add to haul</button>
  </div>
</section>

<footer class="site-footer">Towel Town · Mumbai</footer>
