<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery window – Minute Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="layout-ruled" data-page="slot">
<header class="site-header">
  <a class="brand" href="index.html">Minute Mart</a>
  <nav><a href="cart.html">Your caddy</a></nav>
</header>
<main class="shell">
<aside class="order-box">
  <h2>Order summary</h2>
  <div id="order-lines"></div>
  <div class="line total"><span>Total</span><span id="order-total"></span></div>
</aside>
<h1>Delivery window</h1>
<section class="content">
<p>Pick when the courier should call.</p><div class="slot-choice"><p><label><input type="radio" name="slot" id="slot-day" data-slot="day" value="Daytime 10 am – 6 pm (free)"> Daytime 10 am – 6 pm (free)</label></p><p><label><input type="radio" name="slot" id="slot-evening" data-slot="evening" value="Evening 6 – 9 pm ₹40" checked> Evening 6 – 9 pm ₹40</label></p></div><p><button id="next-button" type="button">Head to checkout</button></p>
</section>
</main>
<footer class="site-footer">Minute Mart · Mumbai</footer>
<script src="app.js"></script>
</body>
</html>
