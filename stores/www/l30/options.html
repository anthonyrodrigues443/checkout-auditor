<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery options – Minute Mart</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="layout-ruled" data-page="options">
<header class="site-header">
  <a class="brand" href="index.html">Minute Mart</a>
  <nav><a href="cart.html">Your caddy</a></nav>
</header>
<main class="shell">
<aside class="order-box">
  <h2>Order summary</h2>
  <div id="order-lines"></div>
  <div class="line total"><span>Total</span><span id="order-total"></span></div>
</aside>
<h1>Delivery and address</h1>
<section class="content">
<div class="address"><strong>Deliver to</strong><br>Asha Menon, 14 Hill Road, Bandra West, Mumbai 400050<br>+91 98200 12345 · asha@example.com</div><p><label>Delivery <select id="delivery-select"><option value="standard" selected>Standard ₹60</option><option value="express">Express ₹150</option></select></label></p><p><label>Purchase protection <select id="cover-select"><option value="none">None – free</option><option value="basic" selected>Basic cover ₹49</option><option value="full">Full cover ₹99</option></select></label></p><p id="notice" class="notice"></p><p><button id="next-button" type="button">Head to checkout</button></p>
</section>
</main>
<footer class="site-footer">Minute Mart · Mumbai</footer>
<script src="app.js"></script>
</body>
</html>
