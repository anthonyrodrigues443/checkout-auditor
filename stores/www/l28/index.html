<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terracotta Planter 8 inch – Pot Luck</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="layout-tiles" data-page="index">
<header class="site-header">
  <a class="brand" href="index.html">Pot Luck</a>
  <nav><a href="cart.html">Your barrow</a></nav>
</header>
<main class="shell">
<section class="product">
  <div class="product-image">Terracotta Planter 8 inch</div>
  <div class="product-info">
  <h1>Terracotta Planter 8 inch</h1>
  <p class="blurb">Hand-thrown terracotta planter, 8 inch, with a hole in the base and a matching saucer.</p>
  <p class="price">₹349 each</p>
  <div class="price-lines">
    <div class="line"><span>Delivery</span><span>₹40</span></div>
  </div>
  <div class="quantity-row">
    <span>Quantity</span>
    <button id="quantity-down" type="button" aria-label="Decrease quantity" title="Decrease quantity">−</button>
    <span id="quantity-count" class="count">1</span>
    <button id="quantity-up" type="button" aria-label="Increase quantity" title="Increase quantity">+</button>
  </div>
  <p id="quantity-total" class="price">Total for 1: ₹349</p>
  <p id="notice" class="notice"></p>
  <button id="add-button" type="button">Add to barrow</button>
  </div>
</section>
</main>
<footer class="site-footer">Pot Luck · Mumbai</footer>
<script src="app.js"></script>
</body>
</html>
