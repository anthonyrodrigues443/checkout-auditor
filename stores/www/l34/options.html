<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery options – Keycap Kiosk</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="layout-drawer" data-page="options">
<header class="site-header">
  <a class="brand" href="index.html">Keycap Kiosk</a>
  <nav><a href="cart.html">Your stack</a></nav>
</header>
<main class="shell">
<h1>Delivery and address</h1>
<section class="content">
<div class="address"><strong>Deliver to</strong><br>Asha Menon, 14 Hill Road, Bandra West, Mumbai 400050<br>+91 98200 12345 · asha@example.com</div>
<p><label>Delivery <select id="delivery-select"><option value="standard" selected>Standard – Free</option><option value="express">Express ₹120</option></select></label></p>
<fieldset class="choice-group"><legend>Purchase protection</legend><p><label><input type="radio" name="protection" id="protection-none" data-choice="none" value="No protection – free"> No protection – free</label></p><p><label><input type="radio" name="protection" id="protection-basic" data-choice="basic" value="Basic protection ₹59" checked> Basic protection ₹59</label></p></fieldset>
<aside class="order-box">
  <h2>Order summary</h2>
  <div id="order-lines"></div>
  <div class="line total"><span>Total</span><span id="order-total"></span></div>
</aside>
<p id="notice" class="notice"></p>
<p><button id="next-button" type="button">On to the next step</button></p>
</section>
</main>
<footer class="site-footer">Keycap Kiosk · Mumbai</footer>
<script src="app.js"></script>
</body>
</html>
